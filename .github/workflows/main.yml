name: lint and test flask app
# sur n'importe quelle branche
on: [push]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # Celui gui fait un "git pull" au sein du runner 
      - uses: actions/checkout@v4
      - name: Setup python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: install dependencies
        run: pip install -r requirements.txt flake8
      - name: run flake 8
        run: flake8 .
  
  test:
    runs-on: ubunut-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup python
      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: install dependencies
        run: pip install -r requirements.txt 
      - name: run tests
        run: pytest
    needs: lint
        
